name: 🗂️ Airtable Documentation Sync

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:      # Manual trigger
    inputs:
      base:
        description: 'Which Airtable base to sync'
        required: false
        default: 'default'
        type: choice
        options:
        - default
        - aulas
        - prod
        - analytics

permissions:
  contents: write

jobs:
  sync-documentation:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout repository
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # 2. Setup Python
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    # 3. Install dependencies
    - name: 📦 Install dependencies
      run: pip install requests
    
    # 4. Determinar qué base sincronizar
    - name: 🔍 Determine which base to sync
      id: select-base
      run: |
        # When triggered by cron, inputs.base is empty — default to "default"
        BASE_SELECTION="${{ github.event.inputs.base }}"
        BASE_SELECTION="${BASE_SELECTION:-default}"
        echo "🔄 Selected base: $BASE_SELECTION"

        if [[ "$BASE_SELECTION" == "aulas" ]]; then
          echo "ENV_SUFFIX=_AULAS" >> $GITHUB_OUTPUT
          echo "OUTPUT_FILE=database-structure-aulas.md" >> $GITHUB_OUTPUT
        elif [[ "$BASE_SELECTION" == "prod" ]]; then
          echo "ENV_SUFFIX=_PROD" >> $GITHUB_OUTPUT
          echo "OUTPUT_FILE=database-structure-prod.md" >> $GITHUB_OUTPUT
        elif [[ "$BASE_SELECTION" == "analytics" ]]; then
          echo "ENV_SUFFIX=_ANALYTICS" >> $GITHUB_OUTPUT
          echo "OUTPUT_FILE=database-structure-analytics.md" >> $GITHUB_OUTPUT
        else
          echo "ENV_SUFFIX=" >> $GITHUB_OUTPUT
          echo "OUTPUT_FILE=database-structure.md" >> $GITHUB_OUTPUT
        fi

        echo "BASE_SELECTION=$BASE_SELECTION" >> $GITHUB_OUTPUT
        
    # 5. Generate documentation
    - name: 🔄 Generate Airtable documentation
      id: generate-docs
      env:
        AIRTABLE_TOKEN_DEFAULT: ${{ secrets.AIRTABLE_TOKEN }}
        AIRTABLE_BASE_ID_DEFAULT: ${{ secrets.AIRTABLE_BASE_ID }}
        AIRTABLE_TOKEN_AULAS: ${{ secrets.AIRTABLE_TOKEN_AULAS }}
        AIRTABLE_BASE_ID_AULAS: ${{ secrets.AIRTABLE_BASE_ID_AULAS }}
        AIRTABLE_TOKEN_PROD: ${{ secrets.AIRTABLE_TOKEN_PROD }}
        AIRTABLE_BASE_ID_PROD: ${{ secrets.AIRTABLE_BASE_ID_PROD }}
        AIRTABLE_TOKEN_ANALYTICS: ${{ secrets.AIRTABLE_TOKEN_ANALYTICS }}
        AIRTABLE_BASE_ID_ANALYTICS: ${{ secrets.AIRTABLE_BASE_ID_ANALYTICS }}
        OUTPUT_FILE: ${{ steps.select-base.outputs.OUTPUT_FILE }}
        BASE_SELECTION: ${{ steps.select-base.outputs.BASE_SELECTION }}
      run: |
        echo "=== GENERATING DOCUMENTATION ==="
        echo "📁 Output file: $OUTPUT_FILE"
        echo "🔑 Base selection: $BASE_SELECTION"

        if [[ "$BASE_SELECTION" == "aulas" ]]; then
          echo "🔄 Using Aulas credentials"
          export AIRTABLE_TOKEN="$AIRTABLE_TOKEN_AULAS"
          export AIRTABLE_BASE_ID="$AIRTABLE_BASE_ID_AULAS"
        elif [[ "$BASE_SELECTION" == "prod" ]]; then
          echo "🔄 Using Prod credentials"
          export AIRTABLE_TOKEN="$AIRTABLE_TOKEN_PROD"
          export AIRTABLE_BASE_ID="$AIRTABLE_BASE_ID_PROD"
        elif [[ "$BASE_SELECTION" == "analytics" ]]; then
          echo "🔄 Using Analytics credentials"
          export AIRTABLE_TOKEN="$AIRTABLE_TOKEN_ANALYTICS"
          export AIRTABLE_BASE_ID="$AIRTABLE_BASE_ID_ANALYTICS"
        else
          echo "🔄 Using Default credentials"
          export AIRTABLE_TOKEN="$AIRTABLE_TOKEN_DEFAULT"
          export AIRTABLE_BASE_ID="$AIRTABLE_BASE_ID_DEFAULT"
        fi

        echo "🔍 Debug - Token length: ${#AIRTABLE_TOKEN}"
        echo "🔍 Debug - Base ID: $AIRTABLE_BASE_ID"

        python sync_airtable.py --output "$OUTPUT_FILE" --base "$BASE_SELECTION"

        if [ ! -f "$OUTPUT_FILE" ]; then
          echo "❌ ERROR: $OUTPUT_FILE was not created"
          exit 1
        fi

        echo "✅ File created successfully"
        echo "📏 File size: $(wc -c < "$OUTPUT_FILE") bytes"
        echo "📄 Preview:"
        head -5 "$OUTPUT_FILE"
        
    # 6. Upload to GitHub
    - name: 📤 Upload to GitHub Repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        FILE_PATH: ${{ steps.select-base.outputs.OUTPUT_FILE }}
      run: |
        echo "=== UPLOADING TO GITHUB REPOSITORY ==="
        echo "📁 Uploading: $FILE_PATH"
        
        # Check if file exists
        if [ ! -f "$FILE_PATH" ]; then
          echo "❌ ERROR: $FILE_PATH not found"
          exit 1
        fi
        
        # Encode file content to base64
        CONTENT_BASE64=$(base64 -w 0 "$FILE_PATH")
        
        # Get file SHA if it exists
        echo "🔍 Checking if file already exists in repository..."
        
        SHA=""
        API_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$REPO/contents/$FILE_PATH")
        
        # Extraer SHA usando jq
        SHA=$(echo "$API_RESPONSE" | jq -r '.sha // empty')
        
        if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
          echo "✅ File exists. SHA: ${SHA:0:8}..."
          COMMIT_MESSAGE="📚 docs: update $FILE_PATH [auto]"
          PAYLOAD_TEMPLATE='{"message":"%s","content":"%s","sha":"%s","committer":{"name":"GitHub Actions","email":"actions@github.com"},"branch":"main"}'
          JSON_PAYLOAD=$(printf "$PAYLOAD_TEMPLATE" "$COMMIT_MESSAGE" "$CONTENT_BASE64" "$SHA")
        else
          echo "🆕 File doesn't exist, will create new"
          COMMIT_MESSAGE="📚 docs: create $FILE_PATH [auto]"
          PAYLOAD_TEMPLATE='{"message":"%s","content":"%s","committer":{"name":"GitHub Actions","email":"actions@github.com"},"branch":"main"}'
          JSON_PAYLOAD=$(printf "$PAYLOAD_TEMPLATE" "$COMMIT_MESSAGE" "$CONTENT_BASE64")
        fi
        
        echo "🚀 Uploading file to GitHub..."
        echo "📏 Payload size: ${#JSON_PAYLOAD} characters"
        
        # Guardar payload en archivo temporal para curl
        echo "$JSON_PAYLOAD" > /tmp/payload.json
        
        # Make API call
        UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/payload.json \
          "https://api.github.com/repos/$REPO/contents/$FILE_PATH")
        
        # Extraer estado HTTP y respuesta
        HTTP_STATUS=$(echo "$UPLOAD_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
        JSON_RESPONSE=$(echo "$UPLOAD_RESPONSE" | grep -v "HTTP_STATUS:")
        
        echo "📊 HTTP Status: $HTTP_STATUS"
        
        # Clean up
        rm -f /tmp/payload.json
        
        # Check response
        if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
          echo "🎉 SUCCESS: File uploaded to repository!"
          
          DOWNLOAD_URL="https://raw.githubusercontent.com/$REPO/main/$FILE_PATH"
          echo "⬇️  Download URL: $DOWNLOAD_URL"
          
          COMMIT_URL=$(echo "$JSON_RESPONSE" | grep -o '"html_url":"[^"]*"' | head -1 | cut -d'"' -f4 2>/dev/null || true)
          if [ -n "$COMMIT_URL" ]; then
            echo "🔗 View commit: $COMMIT_URL"
          fi
        else
          echo "❌ ERROR: Failed to upload file (Status: $HTTP_STATUS)"
          echo "Response:"
          echo "$JSON_RESPONSE" | head -300
          exit 1
        fi
    
    # 7. Create artifact for backup
    - name: 🗃️ Create backup artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.select-base.outputs.OUTPUT_FILE }}
        path: ${{ steps.select-base.outputs.OUTPUT_FILE }}
        retention-days: 7
